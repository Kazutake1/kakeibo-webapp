name: Patch weekly chart height v2.6.20

on:
  push:
    paths:
      - '.github/workflows/patch-weekly-chart-height-v2620.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply weekly chart height change
        run: python3 .github/scripts/patch_weekly_chart_height_v2620.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html sw.js README.md
          git commit -m "Increase weekly chart height v2.6.20"
          git push
