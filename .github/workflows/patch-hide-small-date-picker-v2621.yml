name: Patch hide small date picker v2.6.21

on:
  push:
    paths:
      - '.github/workflows/patch-hide-small-date-picker-v2621.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply requested change
        run: python .github/scripts/patch_hide_small_date_picker_v2621.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npx playwright test
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add style.css index.html sw.js README.md
          git commit -m "v2.6.21 hide small mobile date picker"
          git push
