name: Patch light delete button v2.6.33

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_light_delete_v2633.py'
      - '.github/workflows/patch-light-delete-v2633.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_light_delete_v2633.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify requested light-mode delete styling and release refs
        run: |
          grep -F 'color:#dc2626;' style.css
          grep -F 'border-color:#fecaca;' style.css
          grep -F 'background:#fff1f2;' style.css
          grep -F 'style.css?v=2.6.33' index.html
          grep -F 'app.js?v=2.6.33' index.html
          grep -F "kakeibo-v2.6.33-stable" sw.js
          grep -F "light mode daily-history delete button is red" tests/ui-regression.spec.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add style.css index.html sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.33 stable"
          git push origin main
