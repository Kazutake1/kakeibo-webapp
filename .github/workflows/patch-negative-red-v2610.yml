name: Patch negative and over-budget red styling v2.6.10

on:
  push:
    paths:
      - '.github/workflows/patch-negative-red-v2610.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply red warning styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v2.6.9 Stable' not in s:
              raise SystemExit('Expected v2.6.9 Stable')
          s=s.replace('v2.6.9 Stable','v2.6.10 Stable')
          marker='\n  </style>'
          if marker not in s:
              raise SystemExit('style marker not found')
          css='\n\n    /* v2.6.10: emphasize negative balance and over-budget values */\n    .metric:nth-child(3) .value.neg,\n    .budget-section .actual.neg,\n    .status-stat.remaining .v.neg,\n    .budget-watch-row.over strong{\n      color:#dc2626!important;\n    }\n    body.dark-mode .metric:nth-child(3) .value.neg,\n    body.dark-mode .budget-section .actual.neg,\n    body.dark-mode .status-stat.remaining .v.neg,\n    body.dark-mode .budget-watch-row.over strong{\n      color:#ff6b6b!important;\n    }\n'
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          if 'kakeibo-v2.6.9-stable' not in sws:
              raise SystemExit('Expected v2.6.9 cache')
          sw.write_text(sws.replace('kakeibo-v2.6.9-stable','kakeibo-v2.6.10-stable'),encoding='utf-8')

          r=Path('README.md')
          rs=r.read_text(encoding='utf-8')
          if '# 家計簿Webアプリ v2.6.9 Stable' not in rs:
              raise SystemExit('Expected v2.6.9 README heading')
          rs=rs.replace('# 家計簿Webアプリ v2.6.9 Stable','# 家計簿Webアプリ v2.6.10 Stable',1)
          entry='## v2.6.10 Stable\n- 収支がマイナスの場合、概要の「収支」金額を赤色で強調表示\n- 変動費の実績が予算を超えた項目と合計金額を赤色で強調表示\n- 変動費の残額がマイナスの場合も赤色で表示\n- 「予算残額が少ない項目」で予算超過した金額を赤色で表示\n- ライト/ダーク両モードで警告色の視認性を調整\n- Supabase同期、固定費自動計上、グラフ配色など既存機能は維持\n\n'
          rs=rs.replace('## v2.6.9 Stable\n',entry+'## v2.6.9 Stable\n',1)
          r.write_text(rs,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v2.6.10 Stable' in s
          assert '.metric:nth-child(3) .value.neg' in s
          assert '.budget-section .actual.neg' in s
          assert '.status-stat.remaining .v.neg' in s
          assert 'SUPABASE_URL' in s and 'scheduleCloudSync()' in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/check.js'],check=True)
          ids=re.findall(r'\bid="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate ids'
          assert 'kakeibo-v2.6.10-stable' in Path('sw.js').read_text(encoding='utf-8')
          assert '# 家計簿Webアプリ v2.6.10 Stable' in Path('README.md').read_text(encoding='utf-8')
          print('validation ok')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md
          git rm .github/workflows/patch-negative-red-v2610.yml
          git commit -m "Highlight negative and over-budget values v2.6.10"
          git push
