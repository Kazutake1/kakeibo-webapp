name: Variable expense shopping bag release
on:
  push:
    paths:
      - '.github/workflows/patch-variable-bag-v2647.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only selected icon change
        run: python3 .github/scripts/patch_variable_bag_v2647.py
      - name: Verify file scope and syntax
        run: |
          git diff --check
          node --check app.js
          node --check sw.js
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'README.md app.js index.html style.css sw.js tests/ui-regression.spec.js'
          grep -q 'style.css?v=2.6.47' index.html
          grep -q 'app.js?v=2.6.47' index.html
          grep -q 'kakeibo-v2.6.47-stable' sw.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete UI regression tests
        run: npm test
      - name: Publish verified changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.js index.html style.css sw.js tests/ui-regression.spec.js
          git commit -m 'Release v2.6.47 selected shopping bag icon'
          git push origin main
