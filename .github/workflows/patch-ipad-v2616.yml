name: Patch iPad layout v2.6.16

on:
  push:
    paths:
      - '.github/workflows/patch-ipad-v2616.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only the two iPad fixes
        run: python3 .github/scripts/patch_ipad_v2616.py
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Fix iPad overview layout v2.6.16"
          git push
