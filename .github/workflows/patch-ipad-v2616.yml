name: Patch iPad layout v2.6.16

on:
  push:
    paths:
      - '.github/workflows/patch-ipad-v2616.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only the two iPad fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          if 'v2.6.15 Stable' not in s:
              raise SystemExit('Expected v2.6.15 Stable')
          index.write_text(s.replace('v2.6.15 Stable','v2.6.16 Stable'),encoding='utf-8')

          css=Path('style.css')
          c=css.read_text(encoding='utf-8')
          marker='/* v2.6.16: iPad overview fixes */'
          if marker not in c:
              c += '''

/* v2.6.16: iPad overview fixes */
/* Keep the variable-expense donut legend inside narrow overview cards. */
.card:has(#variableDonut){container-type:inline-size}
@container (max-width:620px){
  .card:has(#variableDonut) .donut-layout{grid-template-columns:1fr;gap:12px;min-height:0}
  .card:has(#variableDonut) .donut-canvas-wrap{height:240px}
  .card:has(#variableDonut) .donut-side-legend{min-width:0;padding-bottom:4px}
}

/* Keep the main page tabs visible while scrolling on tablet-sized screens. */
@media (min-width:701px) and (max-width:1366px){
  .desktop-tabs{
    position:sticky;
    top:calc(60px + env(safe-area-inset-top));
    z-index:19;
    background:var(--bg);
    padding-top:8px;
  }
}
'''
          css.write_text(c,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          if 'kakeibo-v2.6.15-stable' not in w:
              raise SystemExit('Expected v2.6.15 cache')
          sw.write_text(w.replace('kakeibo-v2.6.15-stable','kakeibo-v2.6.16-stable'),encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          if '# 家計簿Webアプリ v2.6.15 Stable' not in r:
              raise SystemExit('Expected v2.6.15 README')
          r=r.replace('# 家計簿Webアプリ v2.6.15 Stable','# 家計簿Webアプリ v2.6.16 Stable',1)
          entry='''## v2.6.16 Stable
- iPadの概要ページで「変動費カテゴリ」が狭いカード幅でも見切れないよう、カード幅に応じてドーナツと凡例を縦配置へ切り替え
- iPadでページをスクロールしても「概要・支出・収入・予算・設定」のタブが画面上部に残るよう固定
- 上記2点以外の機能・表示仕様は変更なし

'''
          r=r.replace('## v2.6.15 Stable\n',entry+'## v2.6.15 Stable\n',1)
          readme.write_text(r,encoding='utf-8')
          PY

          cat >> tests/ui-regression.spec.js <<'EOF'

          test('iPad: variable category card does not clip and tabs stay visible while scrolling', async ({ page }) => {
            await page.setViewportSize({ width: 1024, height: 768 });
            await openApp(page);

            const variableCard = page.locator('.card').filter({ has: page.locator('#variableDonut') }).first();
            const layout = variableCard.locator('.donut-layout');
            const geometry = await variableCard.evaluate(card => ({
              clientWidth: card.clientWidth,
              scrollWidth: card.scrollWidth
            }));
            expect(geometry.scrollWidth).toBeLessThanOrEqual(geometry.clientWidth + 1);

            const columns = await layout.evaluate(el => getComputedStyle(el).gridTemplateColumns);
            expect(columns.trim().split(/\s+/)).toHaveLength(1);

            await page.evaluate(() => window.scrollTo(0, 1200));
            await page.waitForTimeout(100);
            const tabs = page.locator('#tabs');
            await expect(tabs).toBeVisible();
            const box = await tabs.boundingBox();
            expect(box).not.toBeNull();
            expect(box.y).toBeGreaterThanOrEqual(55);
            expect(box.y).toBeLessThan(110);
          });
          EOF
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Fix iPad overview layout v2.6.16"
          git push
