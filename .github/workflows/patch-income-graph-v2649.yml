name: Verify and release iPhone income graph fix
on:
  push:
    paths:
      - '.github/workflows/patch-income-graph-v2649.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch only approved income graph interactions
        run: python3 .github/scripts/patch_income_graph_v2649.py
      - name: Preserve the existing bonus icon path exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old='M12 9c-4 0-6-2-5-4 1-3 5-1 5 4Zm0 0c4 0 6-2 5-4 1-3-5-1-5 4Z'
          new='M12 9c-4 0-6-2-5-4 1-3 5-1 5 4Zm0 0c4 0 6-2 5-4-1-3-5-1-5 4Z'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check syntax asset versions and file scope
        run: |
          git diff --check
          node --check app.js
          node --check sw.js
          node --check tests/ui-regression.spec.js
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'README.md app.js index.html sw.js tests/ui-regression.spec.js'
          grep -q 'style.css?v=2.6.49' index.html
          grep -q 'app.js?v=2.6.49' index.html
          grep -q 'kakeibo-v2.6.49-stable' sw.js
          grep -q 'function selectedIncomeTransactions()' app.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run entire UI regression suite including graph interactions
        run: npm test
      - name: Publish only tested production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.js index.html sw.js tests/ui-regression.spec.js
          git commit -m 'Release v2.6.49 stable income graph selection and period alignment'
          git push origin main
