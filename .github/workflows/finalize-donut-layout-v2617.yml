name: Finalize donut layout v2.6.17

on:
  push:
    paths:
      - '.github/workflows/finalize-donut-layout-v2617.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply final iPad donut layout
        run: python3 .github/scripts/finalize_donut_layout_v2617.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check app.js
      - name: Run tests
        run: npm test
      - name: Commit verified layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css tests/ui-regression.spec.js
          git commit -m "Polish iPad donut layout v2.6.17"
          git push
