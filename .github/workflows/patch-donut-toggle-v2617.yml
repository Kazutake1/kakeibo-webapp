name: Patch donut legend toggle v2.6.17

on:
  push:
    paths:
      - '.github/workflows/patch-donut-toggle-v2617.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply donut toggle patch
        run: python3 .github/scripts/patch_donut_toggle_v2617.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Add donut legend display toggle v2.6.17"
          git push
