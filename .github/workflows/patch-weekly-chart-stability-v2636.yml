name: Patch weekly chart stability v2.6.36

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_weekly_chart_stability_v2636.py'
      - '.github/workflows/patch-weekly-chart-stability-v2636.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested fix
        run: python3 .github/scripts/patch_weekly_chart_stability_v2636.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify stabilization and release refs
        run: |
          grep -F "if(k==='dashboard')scheduleChartDraw();" app.js
          grep -F "if(!dashboardChartsVisible())return false;" app.js
          grep -F "window.addEventListener('resize',()=>scheduleChartDraw(140));" app.js
          grep -F 'style.css?v=2.6.36' index.html
          grep -F 'app.js?v=2.6.36' index.html
          grep -F "kakeibo-v2.6.36-stable" sw.js
          grep -F "weekly chart keeps stable canvas size after hidden-panel redraws on iPad and PC" tests/ui-regression.spec.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add app.js style.css index.html sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.36 stable"
          git push origin main
