name: Patch architecture and tests v2.6.15

on:
  push:
    paths:
      - '.github/workflows/patch-architecture-tests-v2615.yml'

permissions:
  contents: write

jobs:
  refactor-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply refactor
        run: python3 .github/scripts/refactor_v2615.py

      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Run UI regression tests
        run: npm test

      - name: Commit refactor and permanent tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js sw.js README.md package.json package-lock.json playwright.config.js tests/ui-regression.spec.js .github/workflows/ui-regression.yml
          git rm .github/workflows/patch-architecture-tests-v2615.yml .github/scripts/refactor_v2615.py
          git commit -m "Split app code and add UI regression tests v2.6.15"
          git push
