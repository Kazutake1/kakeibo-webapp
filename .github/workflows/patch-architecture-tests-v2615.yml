name: Patch architecture and tests v2.6.15

on:
  push:
    paths:
      - '.github/workflows/patch-architecture-tests-v2615.yml'

permissions:
  contents: write

jobs:
  commit-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply verified refactor
        run: python3 .github/scripts/refactor_v2615.py

      - name: Generate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Static verification
        run: node --check app.js

      - name: Commit verified refactor
        run: |
          rm -f .github/workflows/ui-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js sw.js README.md package.json package-lock.json playwright.config.js tests/ui-regression.spec.js
          git rm .github/workflows/patch-architecture-tests-v2615.yml .github/scripts/refactor_v2615.py
          git commit -m "Split app code and add regression test suite v2.6.15"
          git push
