name: Patch donut gradients v2.6.34

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_donut_gradients_v2634.py'
      - '.github/workflows/patch-donut-gradients-v2634.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_donut_gradients_v2634.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify donut gradient implementation and release refs
        run: |
          grep -F "function donutColor(canvasId,index,count)" app.js
          grep -F "ctx.fillStyle=donutColor(canvasId,i,allData.length);" app.js
          grep -F 'background:${donutColor(canvasId,i,allData.length)}' app.js
          grep -F 'style.css?v=2.6.34' index.html
          grep -F 'app.js?v=2.6.34' index.html
          grep -F "kakeibo-v2.6.34-stable" sw.js
          grep -F "donut legends use ordered blue and green gradients" tests/ui-regression.spec.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add app.js index.html sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.34 stable"
          git push origin main
