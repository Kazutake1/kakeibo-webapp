name: Patch no date picker flash v2.6.24

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-no-date-flash-v2624.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_no_date_flash_v2624.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md sw.js tests/ui-regression.spec.js
          git commit -m "v2.6.24 prevent date picker flash" || exit 0
          git push
