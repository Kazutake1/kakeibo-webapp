name: iPhone summary sizing release check
on:
  push:
    paths:
      - '.github/workflows/patch-mobile-summary-v2644.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply iPhone-only patch
        run: python3 .github/scripts/patch_mobile_summary_v2644.py
      - name: Check changes and JavaScript syntax
        run: git diff --check && node --check app.js && node --check sw.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all regression tests
        run: npm test
      - name: Verify change scope and release assets
        run: |
          git diff --name-only | sort
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'README.md index.html style.css sw.js tests/ui-regression.spec.js'
          grep -q 'style.css?v=2.6.44' index.html
          grep -q 'app.js?v=2.6.44' index.html
          grep -q 'kakeibo-v2.6.44-stable' sw.js
      - name: Publish only tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html style.css sw.js tests/ui-regression.spec.js
          git commit -m 'Release v2.6.44 iPhone compact summary cards'
          git push origin main
