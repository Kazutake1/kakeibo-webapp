name: iPhone variable card height release
on:
  push:
    paths:
      - '.github/workflows/patch-mobile-variable-v2645.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only the requested height correction
        run: python3 .github/scripts/patch_mobile_variable_height_v2645.py
      - name: Check file scope and syntax
        run: |
          git diff --check
          node --check app.js
          node --check sw.js
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'README.md index.html style.css sw.js tests/ui-regression.spec.js'
          grep -q 'style.css?v=2.6.45' index.html
          grep -q 'app.js?v=2.6.45' index.html
          grep -q 'kakeibo-v2.6.45-stable' sw.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all regression tests
        run: npm test
      - name: Publish tested files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html style.css sw.js tests/ui-regression.spec.js
          git commit -m 'Release v2.6.45 iPhone variable card height 80px'
          git push origin main