name: UI Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Static checks
        run: |
          for file in app-data.js app-sync.js app-charts.js app-items.js app-daily.js app-ui.js; do node --check "$file"; done
          node --check sw.js
          node --check scripts/sync-version.mjs
          npm run version:check
          node -e "const fs=require('fs');const styles=['style-base.css','style-components.css','style-theme.css','style-pages.css'];const scripts=['app-data.js','app-sync.js','app-charts.js','app-items.js','app-daily.js','app-ui.js'];const h=fs.readFileSync('index.html','utf8');const js=scripts.map(file=>fs.readFileSync(file,'utf8')).join('\\n');const sw=fs.readFileSync('sw.js','utf8');if(h.includes('<style>')||styles.some(file=>!h.includes(file))||scripts.some(file=>!h.includes(file)))process.exit(1);for(const x of ['SUPABASE_URL','scheduleCloudSync()','effectiveTypeSum','CHART_COLORS_LIGHT','CHART_COLORS_DARK'])if(!js.includes(x))process.exit(1);if(js.toLowerCase().includes('service_role'))process.exit(1);if(styles.some(file=>!sw.includes('./'+file))||scripts.some(file=>!sw.includes('./'+file)))process.exit(1);"

      - name: Run Playwright regression tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
