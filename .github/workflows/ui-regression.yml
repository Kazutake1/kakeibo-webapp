name: UI Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static checks
        run: |
          node --check app.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const js=fs.readFileSync('app.js','utf8');const sw=fs.readFileSync('sw.js','utf8');if(h.includes('<style>')||!h.includes('style.css')||!h.includes('app.js'))process.exit(1);for(const x of ['SUPABASE_URL','scheduleCloudSync()','effectiveTypeSum','CHART_COLORS_LIGHT','CHART_COLORS_DARK'])if(!js.includes(x))process.exit(1);if(js.toLowerCase().includes('service_role'))process.exit(1);if(!sw.includes('./style.css')||!sw.includes('./app.js'))process.exit(1);"

      - name: Run Playwright regression tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
