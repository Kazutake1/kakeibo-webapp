name: Security Validation

on:
  push:
    branches: [security/budget-session-validation-20261012]
    paths:
      - 'app-*.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package*.json'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/security-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-*.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package*.json'
      - '.github/workflows/security-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # Same verified actions as PR #22, without modifying that PR's workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - name: Syntax and release integrity
        run: |
          for file in app-*.js sw.js; do node --check "$file"; done
          npm run version:check
      - run: npx playwright install --with-deps chromium webkit
      - name: Complete Chromium and WebKit regression
        run: npm test
      - name: Failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-playwright-report
          path: playwright-report/
          retention-days: 7
