name: Patch variable budget bar v2.6.39

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_variable_budget_bar_v2639.py'
      - '.github/workflows/patch-variable-budget-bar-v2639.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_variable_budget_bar_v2639.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify requested overview cleanup and variable budget bar
        run: |
          grep -F 'variable-budget-bar' app.js
          grep -F 'variable-budget-bar' style.css
          ! grep -F 'overviewInfoDialog' index.html
          ! grep -F 'overview-info-btn' index.html
          ! grep -F 'mobile-full-note' index.html
          grep -F 'style.css?v=2.6.39' index.html
          grep -F 'app.js?v=2.6.39' index.html
          grep -F "kakeibo-v2.6.39-stable" sw.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add index.html app.js style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.39 stable"
          git push origin main
