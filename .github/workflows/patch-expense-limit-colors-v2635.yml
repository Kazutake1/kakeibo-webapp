name: Patch expense limit colors v2.6.35

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_expense_limit_colors_v2635.py'
      - '.github/workflows/patch-expense-limit-colors-v2635.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_expense_limit_colors_v2635.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify requested thresholds and release refs
        run: |
          grep -F "a>2000?'expense-limit-over':''" app.js
          grep -F "weekTotal>14000?'expense-limit-over':''" app.js
          grep -F 'style.css?v=2.6.35' index.html
          grep -F 'app.js?v=2.6.35' index.html
          grep -F 'kakeibo-v2.6.35-stable' sw.js
          grep -F 'desktop expense daily and weekly totals turn red only above limits' tests/ui-regression.spec.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add app.js style.css index.html sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.35 stable"
          git push origin main
