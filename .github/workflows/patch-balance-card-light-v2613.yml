name: "Patch light balance card v2.6.13"

on:
  push:
    paths:
      - ".github/workflows/patch-balance-card-light-v2613.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply light-mode balance card fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v2.6.12 Stable' not in s:
              raise SystemExit('Expected v2.6.12 Stable')
          s=s.replace('v2.6.12 Stable','v2.6.13 Stable')

          marker='\n  </style>'
          if marker not in s:
              raise SystemExit('style marker not found')

          css='''\n\n    /* v2.6.13: fix light-mode specificity for the balance card */\n    body:not(.dark-mode) .metric:nth-child(3){\n      background:var(--card)!important;\n      border:2px solid var(--accent)!important;\n      color:var(--text)!important;\n      box-shadow:var(--shadow)!important;\n    }\n    body:not(.dark-mode) .metric:nth-child(3) .label{\n      color:var(--muted)!important;\n    }\n    body:not(.dark-mode) .metric:nth-child(3) .value{\n      color:var(--text)!important;\n      text-shadow:none!important;\n    }\n    body:not(.dark-mode) .metric:nth-child(3) .value.pos{\n      color:var(--good)!important;\n    }\n    body:not(.dark-mode) .metric:nth-child(3) .value.neg{\n      color:#dc2626!important;\n    }\n    body:not(.dark-mode) .metric:nth-child(3) .sub{\n      color:var(--muted)!important;\n    }\n    body:not(.dark-mode) .metric:nth-child(3):has(.value.neg) .sub{\n      color:#dc2626!important;\n      font-weight:750;\n    }\n'''
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          if 'kakeibo-v2.6.12-stable' not in sws:
              raise SystemExit('Expected v2.6.12 cache')
          sw.write_text(sws.replace('kakeibo-v2.6.12-stable','kakeibo-v2.6.13-stable'),encoding='utf-8')

          r=Path('README.md')
          rs=r.read_text(encoding='utf-8')
          if '# 家計簿Webアプリ v2.6.12 Stable' not in rs:
              raise SystemExit('Expected v2.6.12 README heading')
          rs=rs.replace('# 家計簿Webアプリ v2.6.12 Stable','# 家計簿Webアプリ v2.6.13 Stable',1)
          entry='''## v2.6.13 Stable\n- ライトモードで「収支」カードに旧青グラデーションが残るCSS優先順位の問題を修正\n- ライトモードでも背景を他カードと同じ色に統一し、青枠のみで識別\n- マイナス時は金額と「赤字」を赤色、プラス時は金額を緑色で表示\n- ダークモードの表示仕様は維持\n- Supabase同期、固定費自動計上、予算超過警告、グラフ配色など既存機能は変更なし\n\n'''
          rs=rs.replace('## v2.6.12 Stable\n',entry+'## v2.6.12 Stable\n',1)
          r.write_text(rs,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v2.6.13 Stable' in s
          assert 'body:not(.dark-mode) .metric:nth-child(3)' in s
          assert 'background:var(--card)!important' in s
          assert 'border:2px solid var(--accent)!important' in s
          assert 'body:not(.dark-mode) .metric:nth-child(3) .value.neg' in s
          assert 'color:#dc2626!important' in s
          assert 'SUPABASE_URL' in s and 'scheduleCloudSync()' in s
          assert 'effectiveTypeSum' in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/check.js'],check=True)
          ids=re.findall(r'\bid="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate ids'
          assert 'kakeibo-v2.6.13-stable' in Path('sw.js').read_text(encoding='utf-8')
          assert '# 家計簿Webアプリ v2.6.13 Stable' in Path('README.md').read_text(encoding='utf-8')
          print('validation ok')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md
          git rm .github/workflows/patch-balance-card-light-v2613.yml
          git commit -m "Fix light balance card v2.6.13"
          git push
