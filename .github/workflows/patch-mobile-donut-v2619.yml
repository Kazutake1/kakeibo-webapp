name: Patch mobile donut layout v2.6.19

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-donut-v2619.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply requested smartphone donut fix
        run: python3 .github/scripts/patch_mobile_donut_v2619.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Match smartphone expense composition donut layout v2.6.19"
          git push
