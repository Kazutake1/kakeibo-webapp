name: Summary card visual check
on:
  push:
    paths:
      - '.github/workflows/patch-summary-visual-v2643.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 .github/scripts/patch_summary_visual_v2643.py
      - run: git diff --check && node --check app.js && node --check sw.js
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publish verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js style.css index.html sw.js README.md tests/ui-regression.spec.js
          git commit -m 'Release v2.6.43 summary visual refinement'
          git push origin main
