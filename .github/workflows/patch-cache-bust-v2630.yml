name: Patch cache bust v2.6.30

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_cache_bust_v2630.py'
      - '.github/workflows/patch-cache-bust-v2630.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_cache_bust_v2630.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify cache-busting references
        run: |
          grep -F 'style.css?v=2.6.30' index.html
          grep -F 'app.js?v=2.6.30' index.html
          grep -F "kakeibo-v2.6.30-stable" sw.js
          grep -F "./style.css?v=2.6.30" sw.js
          grep -F "./app.js?v=2.6.30" sw.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add index.html sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.30 stable"
          git push origin main
