name: Patch smartphone overview info v2.6.38

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_overview_info_v2638.py'
      - '.github/workflows/patch-overview-info-v2638.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_overview_info_v2638.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify requested overview info UI and release refs
        run: |
          grep -F 'id="overviewInfoDialog"' index.html
          grep -F 'id="mobileFullInfoBtn"' index.html
          grep -F 'summary-info-btn' app.js
          grep -F 'metric .sub.summary-explainer{display:none}' style.css
          grep -F 'style.css?v=2.6.38' index.html
          grep -F 'app.js?v=2.6.38' index.html
          grep -F "kakeibo-v2.6.38-stable" sw.js
          grep -F "smartphone overview hides explanatory copy behind info sheets" tests/ui-regression.spec.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add index.html app.js style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.38 stable"
          git push origin main
