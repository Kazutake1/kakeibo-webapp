name: Patch softer light theme v2.6.9

on:
  push:
    paths:
      - '.github/workflows/patch-light-theme-v269.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and validate softer light theme
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re, subprocess

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v2.6.8 Stable' not in s:
              raise SystemExit('Expected v2.6.8 Stable in index.html')
          s=s.replace('v2.6.8 Stable','v2.6.9 Stable')
          marker='\n  </style>'
          if marker not in s:
              raise SystemExit('style closing marker not found')
          css='''

          /* v2.6.9: softer, lower-glare light mode */
          body:not(.dark-mode){
            --bg:#e8edf2;--paper:#eef2f6;--card:#f7f9fb;--line:#cbd6e1;--line-soft:#dce4ec;
            --header:#f5f7f9;--header2:#edf2f6;--text:#1d2a3a;--muted:#6f7f92;--accent:#3d79b8;
            --accent-soft:#e2ebf4;--shadow:0 10px 28px rgba(45,67,92,.08);--ink:#1d2a3a;
            background:linear-gradient(180deg,#e4ebf2 0,#edf2f6 250px,#e8edf2 100%)!important;color:var(--text)
          }
          body:not(.dark-mode) .app{background:linear-gradient(180deg,#e4ebf2 0,#eef2f6 260px,#e8edf2 100%)}
          body:not(.dark-mode) .topbar{background:rgba(246,248,250,.95)!important;border-bottom-color:#d6e0e9!important;box-shadow:0 5px 18px rgba(45,67,92,.06)!important}
          body:not(.dark-mode) .topbar .monthnav button,body:not(.dark-mode) .theme-toggle{background:#eef3f7!important;border-color:#d2dde7!important;color:#24364a!important}
          body:not(.dark-mode) .metric,body:not(.dark-mode) .card,body:not(.dark-mode) .budget-section,body:not(.dark-mode) .status-stat,body:not(.dark-mode) .table-wrap,body:not(.dark-mode) .mobile-quick-entry,body:not(.dark-mode) .mobile-recent,body:not(.dark-mode) dialog,body:not(.dark-mode) .mobile-month-calendar,body:not(.dark-mode) .mobile-day-card{background:#f7f9fb!important;border-color:#dce4ec!important;box-shadow:0 10px 28px rgba(45,67,92,.075)!important}
          body:not(.dark-mode) .card h2,body:not(.dark-mode) .budget-section h3,body:not(.dark-mode) .data-table th,body:not(.dark-mode) .cal-table th,body:not(.dark-mode) .row.total{background:#edf2f6!important;border-color:#d8e1e9!important;color:#2a3d52!important}
          body:not(.dark-mode) .variable-status{background:linear-gradient(180deg,#f3f6f9,#edf2f6)!important;border-color:#dce4ec!important}
          body:not(.dark-mode) .status-stat{background:#f9fafb!important}
          body:not(.dark-mode) .field input,body:not(.dark-mode) .field select,body:not(.dark-mode) .quick-amount input,body:not(.dark-mode) .secondary,body:not(.dark-mode) .item-chip,body:not(.dark-mode) .daily-history-buttons button,body:not(.dark-mode) .daily-native-date{background:#f0f4f7!important;border-color:#d1dce6!important;color:#24364a!important}
          body:not(.dark-mode) .calendar,body:not(.dark-mode) .cal-cell,body:not(.dark-mode) .data-table td{background:#f8fafb!important}
          body:not(.dark-mode) .cal-cell:hover,body:not(.dark-mode) .data-table tbody tr:hover td{background:#edf3f7!important}
          body:not(.dark-mode) .cal-cat{background:#eef3f7!important;color:#4d647c!important}
          body:not(.dark-mode) .mobile-nav{background:rgba(246,248,250,.96)!important;border-top-color:#d7e0e8!important;box-shadow:0 -7px 20px rgba(45,67,92,.07)!important}
          body:not(.dark-mode) .mobile-quick-head{background:linear-gradient(135deg,#477fb7,#6194c7)!important}
          body:not(.dark-mode) .primary{background:linear-gradient(135deg,#3d79b8,#548bc3)!important;box-shadow:0 7px 16px rgba(61,121,184,.18)!important}
          body:not(.dark-mode) .metric:nth-child(3){background:linear-gradient(145deg,#427fbf,#6097cb)!important}
          body:not(.dark-mode) .progress,body:not(.dark-mode) .variable-status .big-progress{background:#dce4ec!important}
          body:not(.dark-mode) .variable-status .big-progress span{background:linear-gradient(90deg,#3f7fbe,#6a9dce)!important}
          body:not(.dark-mode) .sync-status-row,body:not(.dark-mode) .daily-history-row,body:not(.dark-mode) .day-summary-strip{background:#eef3f7!important;border-color:#dce4ec!important}
          '''
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          if 'kakeibo-v2.6.8-stable' not in sws:
              raise SystemExit('Expected v2.6.8 cache')
          sw.write_text(sws.replace('kakeibo-v2.6.8-stable','kakeibo-v2.6.9-stable'),encoding='utf-8')

          r=Path('README.md')
          rs=r.read_text(encoding='utf-8')
          rs=rs.replace('# 家計簿Webアプリ v2.6.8 Stable','# 家計簿Webアプリ v2.6.9 Stable',1)
          entry='''## v2.6.9 Stable
          - ライトモードを低眩度のブルーグレー基調へ調整
          - 背景を淡いブルーグレー、カードをオフホワイトへ変更し、白面積の発光感を軽減
          - 入力欄・表・カレンダー・ナビゲーションも純白を避けた落ち着いた明度へ統一
          - 青のアクセントを少し落ち着かせ、視認性を維持しながら刺激を軽減
          - ダークモード、グラフ配色、Supabase同期、既存機能は変更なし

          '''
          rs=rs.replace('## v2.6.8 Stable\n',entry+'## v2.6.8 Stable\n',1)
          r.write_text(rs,encoding='utf-8')

          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/check.js'],check=True)
          ids=re.findall(r'\bid="([^"]+)"',s)
          assert len(ids)==len(set(ids))
          assert 'CHART_COLORS_LIGHT' in s and 'CHART_COLORS_DARK' in s
          assert 'SUPABASE_URL' in s and 'scheduleCloudSync()' in s
          assert 'body:not(.dark-mode)' in s and '#e8edf2' in s and '#f7f9fb' in s and '#3d79b8' in s
          print('validation ok')
          PY
          python3 /tmp/patch.py
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md
          git rm .github/workflows/patch-light-theme-v269.yml
          git commit -m "Soften light mode palette v2.6.9"
          git push
