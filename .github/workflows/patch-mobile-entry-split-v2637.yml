name: Patch mobile entry split v2.6.37

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_mobile_entry_split_v2637.py'
      - '.github/workflows/patch-mobile-entry-split-v2637.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_mobile_entry_split_v2637.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify requested mobile split and release refs
        run: |
          grep -F '今日の変動費を入力' index.html
          grep -F 'id="mobileFullEntry"' index.html
          grep -F 'class="mobile-full-badge">全項目' index.html
          grep -F 'style.css?v=2.6.37' index.html
          grep -F 'app.js?v=2.6.37' index.html
          grep -F "kakeibo-v2.6.37-stable" sw.js
          grep -F "smartphone separates variable quick entry from full entry" tests/ui-regression.spec.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add index.html style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.37 stable"
          git push origin main
# retry after an intermittent existing donut-canvas timing failure
