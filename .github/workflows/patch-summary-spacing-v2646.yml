name: iPhone summary label spacing release
on:
  push:
    paths:
      - '.github/workflows/patch-summary-spacing-v2646.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scoped spacing update
        run: python3 .github/scripts/patch_summary_spacing_v2646.py
      - name: Check diff and JavaScript syntax
        run: |
          git diff --check
          node --check app.js
          node --check sw.js
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'README.md index.html style.css sw.js tests/ui-regression.spec.js'
          grep -q 'style.css?v=2.6.46' index.html
          grep -q 'app.js?v=2.6.46' index.html
          grep -q 'kakeibo-v2.6.46-stable' sw.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI regression tests
        run: npm test
      - name: Publish verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html style.css sw.js tests/ui-regression.spec.js
          git commit -m 'Release v2.6.46 iPhone summary label amount spacing'
          git push origin main
