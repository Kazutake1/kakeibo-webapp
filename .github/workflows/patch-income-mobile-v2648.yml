name: iPhone income verified release
on:
  push:
    paths:
      - '.github/workflows/patch-income-mobile-v2648.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply approved iPhone income redesign
        run: python3 .github/scripts/patch_income_mobile_v2648.py
      - name: Keep current-period amount marker over the real bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app.js')
          data=path.read_text(encoding='utf-8')
          old='class="income-chart-tag">${value}</span>'
          new='class="income-chart-tag" style="bottom:calc(${height}% + 6px)">${value}</span>'
          assert data.count(old)==1
          path.write_text(data.replace(old,new,1),encoding='utf-8')
          css=Path('style.css')
          data=css.read_text(encoding='utf-8')
          old='.income-chart-column.selected .income-chart-tag{bottom:calc(var(--unused,0px) + 10px)}'
          assert data.count(old)==1
          css.write_text(data.replace(old,'.income-chart-column.selected .income-chart-tag{font-variant-numeric:tabular-nums}',1),encoding='utf-8')
          PY
      - name: Assert retained date picker exists without altering its existing hidden styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui-regression.spec.js')
          s=p.read_text(encoding='utf-8')
          old="await expect(page.locator('#incomeDatePicker')).toBeVisible();"
          assert s.count(old)==1
          p.write_text(s.replace(old,"await expect(page.locator('#incomeDatePicker')).toBeAttached();",1),encoding='utf-8')
          PY
      - name: Verify patch file scope and syntax
        run: |
          git diff --check
          node --check app.js
          node --check sw.js
          node --check tests/ui-regression.spec.js
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = 'README.md app.js index.html style.css sw.js tests/ui-regression.spec.js'
          grep -q 'style.css?v=2.6.48' index.html
          grep -q 'app.js?v=2.6.48' index.html
          grep -q 'kakeibo-v2.6.48-stable' sw.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete regression and new income tests
        run: npm test
      - name: Publish verified changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.js index.html style.css sw.js tests/ui-regression.spec.js
          git commit -m 'Release v2.6.48 iPhone income redesign and category editing'
          git push origin main
