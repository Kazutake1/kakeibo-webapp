name: Patch sync choice dialog v2.6.31

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_sync_choice_dialog_v2631.py'
      - '.github/workflows/patch-sync-choice-v2631.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested change
        run: python3 .github/scripts/patch_sync_choice_dialog_v2631.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Run regression tests
        run: npm test
      - name: Verify dedicated sync dialog and release refs
        run: |
          grep -F 'id="syncChoiceDialog"' index.html
          grep -F 'クラウドのデータを使う' index.html
          grep -F 'この端末のデータを使う' index.html
          grep -F 'style.css?v=2.6.31' index.html
          grep -F 'app.js?v=2.6.31' index.html
          grep -F "kakeibo-v2.6.31-stable" sw.js
          ! grep -F 'const useCloud=confirm' app.js
      - name: Commit verified change
        run: |
          git config user.name "Kazutake1"
          git config user.email "i8ayxda1tonezzo@yahoo.co.jp"
          git add index.html app.js style.css sw.js README.md tests/ui-regression.spec.js
          git commit -m "Release v2.6.31 stable"
          git push origin main
