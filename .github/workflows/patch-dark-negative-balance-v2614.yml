name: Patch dark negative balance v2.6.14

on:
  push:
    paths:
      - '.github/workflows/patch-dark-negative-balance-v2614.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply dark negative balance fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v2.6.13 Stable' not in s:
              raise SystemExit('Expected v2.6.13 Stable')
          s=s.replace('v2.6.13 Stable','v2.6.14 Stable')
          marker='\n  </style>'
          css='''\n\n    /* v2.6.14: force red negative balance in dark mode */\n    body.dark-mode .metric:nth-child(3):has(.value.neg) .value.neg{\n      color:#ff6b6b!important;\n      text-shadow:none!important;\n    }\n    body.dark-mode .metric:nth-child(3):has(.value.neg) .sub{\n      color:#ff8d92!important;\n      font-weight:750;\n    }\n'''
          if marker not in s:
              raise SystemExit('style marker not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          if 'kakeibo-v2.6.13-stable' not in sws:
              raise SystemExit('Expected v2.6.13 cache')
          sw.write_text(sws.replace('kakeibo-v2.6.13-stable','kakeibo-v2.6.14-stable'),encoding='utf-8')

          r=Path('README.md')
          rs=r.read_text(encoding='utf-8')
          if '# 家計簿Webアプリ v2.6.13 Stable' not in rs:
              raise SystemExit('Expected v2.6.13 README heading')
          rs=rs.replace('# 家計簿Webアプリ v2.6.13 Stable','# 家計簿Webアプリ v2.6.14 Stable',1)
          entry='''## v2.6.14 Stable\n- ダークモードの「収支」カードで、収支マイナス時の金額を赤色で確実に表示するようCSS優先順位を修正\n- 「赤字」表示も赤系のまま維持\n- 青枠＋通常カード背景のデザインはライト/ダーク両方で維持\n- Supabase同期、固定費自動計上、予算警告、グラフ配色など既存機能は変更なし\n\n'''
          rs=rs.replace('## v2.6.13 Stable\n',entry+'## v2.6.13 Stable\n',1)
          r.write_text(rs,encoding='utf-8')
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v2.6.14 Stable' in s
          assert 'body.dark-mode .metric:nth-child(3):has(.value.neg) .value.neg' in s
          assert 'color:#ff6b6b!important' in s
          assert 'body:not(.dark-mode) .metric:nth-child(3)' in s
          assert 'SUPABASE_URL' in s and 'scheduleCloudSync()' in s
          assert 'effectiveTypeSum' in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/check.js'],check=True)
          ids=re.findall(r'\bid="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate ids'
          assert 'kakeibo-v2.6.14-stable' in Path('sw.js').read_text(encoding='utf-8')
          assert '# 家計簿Webアプリ v2.6.14 Stable' in Path('README.md').read_text(encoding='utf-8')
          print('validation ok')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md
          git rm .github/workflows/patch-dark-negative-balance-v2614.yml
          git commit -m "Fix dark negative balance color v2.6.14"
          git push
